name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests und Weboberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Weboberfläche bauen
        run: npm run build

      - name: Rauchtest im Browser
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
          node scripts/smoke-test.mjs
        env:
          SMOKE_OUT: screenshots

      - name: Webpaket als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: syntheseplaner-web
          path: dist
          retention-days: 30

      - name: Bildschirmfotos ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

  windows:
    name: Windows-Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Windows-Anwendung bauen
        run: npm run tauri:build

      - name: Installer als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: syntheseplaner-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Bei einem Versionstag eine Veröffentlichung anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
